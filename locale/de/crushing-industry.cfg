[mod-setting-description]
crushing-industry-space-crusher=Verstärke den Vanilla-SA-Zerkleinerer, für eine beeindruckende Basisqualität von +12,5 % — allerdings auf Kosten des Stromverbrauchs und einer weiteren Technologie.
crushing-industry-space-crusher-quality=Erhöhe die Grundqualität des Weltraumzerkleinerers um +12,5 %, was jedoch mit einem höheren Energieverbrauch einhergeht. Keine Auswirkung, wenn der Weltraumzerkleinerer nicht aktiviert ist.
crushing-industry-big-crusher=Schalte für Vulcanus + 50 % Basisproduktivität frei.
crushing-industry-glass=Zerkleinere Stein zu Sand und verhütte es zu Glas.
crushing-industry-optical-fiber=Fügt ein neues Zwischenprodukt hinzu das in Integrierten Schaltkreisen und anderen elektronischen Bauteilen verwendet wird.
crushing-industry-ore=Zerkleinere Erz zur effizienteren Produktion.
crushing-industry-smelting-productivity=Fügt Produktivitätsforschung hinzu zur Verhüttung von zerkleinertem Erz und Sand zu Platten, sowie Schmelzung zu geschmolzenem Erz / Glas. Keine Auswirkung, wenn Erzzerkleinerung nicht aktiviert ist.
crushing-industry-coal=Crush coal for more efficient chemical processes.
crushing-industry-coal=Zerkleinere Kohle zur effizienteren chemischen Verarbeitung.
crushing-industry-concrete-mix=Kombiniert Wasser, Sand und zerkleinertes Eisen zu einem einzigen flüssigen Baustoff um daraus Beton herzustellen.
crushing-industry-concrete-spoil-amount=Wie viel Beton entsteht pro Fass Betonmischung als Ausschuss (0 = kein Ausschuss).
crushing-industry-concrete-machine-ignorelist=Komma-separierte Liste von Maschinen, die nicht verhindern sollen, dass die konkreten Zutaten eines Rezepts in Betonmischung umgewandelt werden. Weißraum ist wichtig; Füge keine Leerzeichen vor/nach Kommas hinzu. Beispiel: burner-assembling-machine,assembling-machine-1
crushing-industry-modify-vanilla=Ersetze in Rezepten die Zutaten von ihrer rohen Form durch die zerkleinerten Varianten, anstatt doppelte Rezepte anzulegen.
crushing-industry-byproducts=Füge Ergebnisse mit niedrigem Prozentsatz den Zerkleinerungsrezepten hinzu, um das Spielerlebnis ein bisschen chaotischer zu gestalten.
crushing-industry-hide-player-crafting=Rezepte ausblenden, die mit bereits vorhandenen Rezepten identisch sind, abgesehen davon, dass die Zutaten zuerst zerkleinert werden.
crushing-industry-bztin-space=Füge Zinnerz als Nebenprodukt der Asteroidenzerkleinerung hinzu, sodass elektronische Schaltkreise im Weltraum auch ohne Weltraumzerkleinerer hergestellt werden können. (Am besten in Kombination mit dem Mod „Cupric Asteroids“!)
crushing-industry-bzcarbon-space=Füge Flockengraphit und Rohdiamanten als Nebenprodukte der Asteroidenzerkleinerung hinzu, sodass elektronische Schaltkreise im Weltraum auch ohne Weltraumzerkleinerer hergestellt werden können.
crushing-industry-k2=Sand und Glas von Krastorio 2 durch Sand und Glas von Crushing Industry ersetzen (sofern aktiviert).
